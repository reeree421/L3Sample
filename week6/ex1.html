<!DOCTYPE html>
<html>
<head>
    <title>Exercise 1</title>
    <style>
	body {
		text-align: center;
	}
        .border-img {
		border: 5px solid black; 
		width: 250px;
		height: 250px;
		display: block;
		margin: 20px auto;
        }
        .resized-img {
		width: 100px;
		height: 100px; 
		display: block;
		margin: 10px auto;
        }
        .aligned-right {
		float: right; 
		width: 250px;
		height: 250px;
		margin: 20px 20px;
		margin-right: 0px;
        }
        .spaced-img {
		margin: 50px auto; 
		width: 250px;
		height: 250px;
		display: block;
        }
	p {	
		margin-right: 30px;
		margin-bottom:30px;
		font-weight: bold;
	}
	.container {
		width: 90%;
		margin: auto;
		overflow: hidden;
	}
        .right-align {
            display: block;
            margin: 10px auto;
        }
	.image-container {
            position: relative;
            display: inline-block; 
        }
        .image-text {
	    position: relative;
            text-align: right;
            display: block;
            margin-top: 5px; 
	    
        }
        .image3-wrapper {
            top: 10px; 
            text-align: center;
        
    </style>
</head>
<body>

	<div class="container">
	
    <!-- Image 1 with Border -->
	<img src="image1.jpg" class="border-img" alt="Image 1">
	<p>Image 1 - Orchid</p>
	<br><br>
    
    <!-- Image 2 Resized with Anchor -->
	
	<a href="image2.jpg" target="_blank">
        	<img src="image2.jpg" class="resized-img" alt="Image 2">
	</a>
	<p>Image 2 - Black & White Flower</p>
	<br><br>

    <!-- Image 3 Aligned -->
	<div class=“image3-wrapper”>
	<img src="image3.jpg" class="aligned-right" alt="Image 3">
	<br><br>
	<br><br>
	<br><br>
	<br><br>
	<br><br>
	<br><br>
	<br><br>
	<br><br>
	
	<p class=“image-text” align="right">Image 3 - Orange Flower</p>
	<br><br>
	
<!-- Image 4 with Space -->
	
	<img src="image4.png" class="spaced-img" alt="Image 4">
	<p>Image 4 - Purple Orchid</p>
	</div>

</body>
</html>
