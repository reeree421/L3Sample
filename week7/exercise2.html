<!DOCTYPE html>
<html>
<head>
	<title>Exercise 2</title>
</head>
<body>
	<h3>HTML Form Test</h3>
	<form>
        <table>
		<tr>
                	<td style="padding-right: 100px;">Name</td>
                	<td><input type="text" name="name"></td>
		</tr>
		<tr style="height: 10px;"></tr>

		<tr>
                	<td style="padding-right: 100px;">Address</td>
                	<td><input type="text" name="address"></td>
		</tr>
		<tr style="height: 10px;"></tr>
		<tr>
                	<td style="padding-right: 100px;">Email</td>
                	<td><input type="email" name="email"></td>
		</tr>
		<tr style="height: 10px;"></tr>

		<tr>
                	<td style="padding-right: 100px;">Gender</td>
                	<td>
			<input type="radio" name="gender" value="male"> Male
			<input type="radio" name="gender" value="female"> Female
                	</td>
		</tr>
		<tr style="height: 10px;"></tr>
		<tr>
                	<td style="padding-right: 100px;">Hobbies</td>
                	<td>
			<input type="checkbox" name="hobby" value="sports"> Sports
			<input type="checkbox" name="hobby" value="movies"> Movies
			<input type="checkbox" name="hobby" value="travelling"> Travelling
               		</td>
		</tr>
		<tr style="height: 10px;"></tr>
		<tr>
                	<td style="padding-right: 100px;">Country</td>
                	<td>
			<select name="country" style="width:200px;">
                        	<option>Nepal</option>
			</select>
                	</td>
		</tr>
		<tr style="height: 10px;"></tr>
		<tr>
                	<td style="padding-right: 100px;">Message</td>
                	<td><textarea name="message" rows="5" cols="40"></textarea></td>
		</tr>
		<tr style="height: 10px;"></tr>
		<tr>
                	<td></td>
                	<td>
				<input type="submit" value="Submit">
				<input type="reset" value="Reset">
               		</td>
            	</tr>
        </table>
    </form>
</body>
</html>
