<!DOCTYPE html>
<html>
<head>
	<title>Exercise 1</title>
</head>
<body>
	<h2>Search our web site!</h2>
	<hr>
	<form>
		<p>Where do you want to search?</p>
		<input type="radio" name="search" value="whole" checked> Whole site<br>
		<input type="radio" name="search" value="business"> Business Partners Section<br>
		<input type="radio" name="search" value="corporate"> Corporate Communications Section<br>
		<input type="radio" name="search" value="lotus"> Lotus Education Section<br>

		<p>Enter a word or two that we can search on:</p>
		<input type="text" name="query" size="40"><br><br>

		<input type="submit" value="Submit">
		<input type="reset" value="Clear">
	</form>
</body>
</html>
