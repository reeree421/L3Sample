<!DOCTYPE html>
<html>
<head>
	<title>Task 1_Table Layout with different colors</title>
    	<link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="container">
        <!-- Header Row Part -->
        <div class="header">
            <div class="header-column">Column 1</div>
            <div class="header-column">Column 2</div>
            <div class="header-column">Column 3</div>
        </div>

        <!-- First Column -->
        <div class="first-column">
            <p>A numbered list:</p>
            <ol>
                <li>Able</li>
                <li>Baker</li>
                <li>Charlie</li>
                <li>Delta</li>
                <li>Echo</li>
            </ol>
        </div>

        <!-- Second Column -->
        <div class="second-column">
            <p style="margin-right: 10px;">B</p>
        </div>

        <!-- Third Column -->
        <div class="third-column">
            <p>C</p>
        </div>

        <!-- Fourth Column (Spanning Green Box) -->
        <div class="fourth-column">
            <p>An unnumbered list:</p>
            <ul>
                <li>Pounds</li>
                <li>Dollars</li>
                <li>Euro</li>
                <li>Yen</li>
                <li>Roubles</li>
            </ul>
        </div>
    </div>
</body>
</html>
